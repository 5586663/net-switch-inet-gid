name: Build net-switch (merged shell + zygisk)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule content
        run: |
          test -f external/AndroidVMTools/gradle/libs.versions.toml \
            || { echo 'FATAL: AndroidVMTools submodule is empty'; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build zygote release
        run: ./gradlew :zygote:assembleRelease --stacktrace

      - name: Merge into single Magisk module
        run: |
          set -e
          ZYGISK_ZIP=$(find . -name '*ZYGISK*.zip' -not -path './.git/*' | head -1)
          test -n "$ZYGISK_ZIP" || { echo 'FATAL: zygisk zip not found'; exit 1; }
          echo "zygisk zip: $ZYGISK_ZIP"

          rm -rf /tmp/merge && mkdir -p /tmp/merge

          # 1. 以 net-switch 原 module/ 为基底（id=net-switch）
          cp -r module/. /tmp/merge/

          # 2. 解开 zygisk 产物到临时目录
          rm -rf /tmp/zygisk && mkdir -p /tmp/zygisk
          unzip -q "$ZYGISK_ZIP" -d /tmp/zygisk

          # 3. 把 zygisk 的 .so / classes.dex / dexopt 叠进去
          cp -r /tmp/zygisk/zygisk /tmp/merge/ 2>/dev/null || true
          cp /tmp/zygisk/classes.dex /tmp/merge/ 2>/dev/null || true
          cp -r /tmp/zygisk/dexopt /tmp/merge/ 2>/dev/null || true

          # 4. 检查关键文件
          test -f /tmp/merge/zygisk/arm64-v8a.so || { echo 'FATAL: zygisk .so missing'; exit 1; }
          test -f /tmp/merge/service.sh || { echo 'FATAL: net-switch service.sh missing'; exit 1; }
          test -f /tmp/merge/module.prop || { echo 'FATAL: module.prop missing'; exit 1; }

          # 5. 更新 module.prop 标注融合版
          sed -i 's/^description=.*/description=Isolate apps from Internet access (iptables + INET_GID strip, isolated.json driven)/' /tmp/merge/module.prop
          sed -i 's/^name=.*/name=Net Switch (INET_GID)/' /tmp/merge/module.prop

          # 6. 打最终 zip
          cd /tmp/merge
          zip -r -9 /tmp/net-switch-merged.zip . -x '.*'
          ls -la /tmp/net-switch-merged.zip

      - name: Upload merged module
        uses: actions/upload-artifact@v4
        with:
          name: net-switch-merged
          path: /tmp/net-switch-merged.zip
          if-no-files-found: error

      - name: Upload raw zygisk (for debug)
        uses: actions/upload-artifact@v4
        with:
          name: net-switch-zygisk-raw
          path: '**/*ZYGISK*.zip'
          if-no-files-found: warn
