name: Build net-switch (merged shell + zygisk)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone AndroidVMTools dependency
        run: |
          git clone --depth 1 https://github.com/aerath-stuff/AndroidVMTools external/AndroidVMTools
          test -f external/AndroidVMTools/src/main/java/com/v7878/vmtools/Hooks.java \
            || { echo 'FATAL: AndroidVMTools clone failed'; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build zygote release
        run: ./gradlew :zygote:assembleRelease --stacktrace

      - name: Merge into single Magisk module
        run: |
          set -e
          ZYGISK_ZIP=$(find . -name '*ZYGISK*.zip' -not -path './.git/*' | head -1)
          test -n "$ZYGISK_ZIP" || { echo 'FATAL: zygisk zip not found'; exit 1; }
          echo "zygisk zip: $ZYGISK_ZIP"

          rm -rf /tmp/merge && mkdir -p /tmp/merge
          cp -r module/. /tmp/merge/

          rm -rf /tmp/zygisk && mkdir -p /tmp/zygisk
          unzip -q "$ZYGISK_ZIP" -d /tmp/zygisk
          echo '--- zygisk zip contents ---'
          find /tmp/zygisk -type f | sort

          cp -r /tmp/zygisk/zygisk /tmp/merge/
          cp /tmp/zygisk/classes.dex /tmp/merge/
          cp -r /tmp/zygisk/dexopt /tmp/merge/ 2>/dev/null || true
          cp -r /tmp/zygisk/packages /tmp/merge/

          test -f /tmp/merge/zygisk/arm64-v8a.so || { echo 'FATAL: .so missing'; exit 1; }
          test -f /tmp/merge/classes.dex || { echo 'FATAL: classes.dex missing'; exit 1; }
          test -f /tmp/merge/packages/.all || { echo 'FATAL: packages/.all missing'; exit 1; }
          test -f /tmp/merge/packages/.all || { echo 'FATAL: packages/.all missing'; exit 1; }

          cd /tmp/merge
          zip -r -9 /tmp/net-switch-merged.zip .
          echo '--- final merged contents ---'
          unzip -l /tmp/net-switch-merged.zip

      - name: Upload merged module
        uses: actions/upload-artifact@v4
        with:
          name: net-switch-merged
          path: /tmp/net-switch-merged.zip
          if-no-files-found: error

      - name: Upload raw zygisk
        uses: actions/upload-artifact@v4
        with:
          name: net-switch-zygisk-raw
          path: '**/*ZYGISK*.zip'
          if-no-files-found: warn
